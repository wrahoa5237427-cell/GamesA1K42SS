<style>
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
:root{--line:rgba(255,215,120,.4)}

.opt:hover{background:#f0bd4533;transform:scale(1.015)}.opt b{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#f0bd45;color:#3a1a00}
.opt.ok{background:#1f9d57;border-color:#7dffb0;animation:pop .5s}.opt.no{background:#b3283a;border-color:#ff8f9c;animation:sk .4s}.opt.dim{opacity:.4}

.big{font-size:32px}.key ul{padding-left:22px;display:grid;gap:8px;font-size:19px;line-height:1.45}.key li::marker{color:#f0bd45}
.ex{margin-top:12px;background:#ffffff14;border-radius:12px;padding:12px 14px}.res{margin-top:14px;font-size:20px;font-weight:800;color:#ffe08a}.mk{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0;padding:12px 16px;border-radius:14px;background:#ffffff12;border:1px solid var(--line);font-size:18px}
.ctl{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.mb{width:min(520px,100%);max-height:92vh;overflow:auto;background:linear-gradient(#3a0f45,#1c0626);border:1.5px solid var(--line);border-radius:22px;padding:26px;text-align:center;display:grid;gap:12px;box-shadow:0 20px 60px #000a}
.mb h3{font-size:28px}.mb label{text-align:left;font-weight:700;font-size:14px;opacity:.85}.mb textarea{width:100%;border-radius:12px;padding:10px;font:inherit;font-size:14px;background:#0006;color:#fff;border:1px solid var(--line)}
#sn{font-size:clamp(34px,9vw,58px);min-height:76px;display:grid;place-items:center;line-height:1.1}#sn.win{animation:pop .6s;filter:drop-shadow(0 0 18px #f0bd45)}
.rk{display:grid;grid-template-columns:40px 1fr auto;text-align:left;padding:9px 12px;border-radius:10px;background:#ffffff12;align-items:center}.rk em{font-style:normal;font-weight:900;color:#ffe08a}

#app{max-width:1180px}
.card h2{font-size:clamp(22px,3.3vw,38px)}
.opt{font-size:clamp(17px,2.3vw,26px);cursor:default}.opt:hover{transform:none;background:rgba(255,255,255,.08)}.opt.ok:hover{background:#1f9d57}
.opts.one{grid-template-columns:1fr}
.tag{font-weight:800;letter-spacing:2px;font-size:14px;color:#a8ffc8}
.dots{display:flex;gap:7px;justify-content:center;margin:12px 0 0}.dots i{width:30px;height:9px;border-radius:5px;background:#fff3;cursor:pointer}.dots i.dn{background:#f0bd4577}.dots i.on{background:#ffe08a;box-shadow:0 0 12px #f0bd45}
.imgs{display:flex;gap:14px;margin-bottom:16px}

.img img{max-width:100%;max-height:38vh;border-radius:10px}.img small{display:block;opacity:.7;margin-top:6px;font-size:13px}.img:has(img){border-style:solid;padding:6px}
.tfs{display:grid;gap:10px}
.tfr{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.08);border:1.5px solid var(--line);font-size:clamp(17px,2.3vw,24px);font-weight:600;text-align:left}
.tfr b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#f0bd45;color:#3a1a00}
.tfr i{font-style:normal;font-weight:900;min-width:76px;text-align:center}.tfr.ok{background:#1f9d57;border-color:#7dffb0}.tfr.no{background:#b3283a;border-color:#ff8f9c}
.seq{margin-top:16px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:26px;font-weight:900}.seq b{background:#f0bd45;color:#3a1a00;border-radius:12px;padding:6px 14px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mt>div{display:grid;gap:10px;align-content:start}
.ansbox{font-size:clamp(26px,4vw,44px);text-align:center;padding:8px;line-height:1.3}
.ans .key{margin-top:4px}
.btn.big{font-size:24px;padding:18px 46px}
@media(max-width:700px){.mt{grid-template-columns:1fr}.imgs{flex-direction:column}}
body{background:radial-gradient(ellipse at 50% -10%,#2ecb6a,transparent 55%),radial-gradient(ellipse at 85% 105%,#0f7a3c,transparent 60%),#04210f;background-attachment:fixed}
.logo{height:76px;background:#fff;border-radius:18px;padding:6px;box-shadow:0 4px 16px #0006}.logo.sm{height:46px;border-radius:12px;padding:3px}
.lf{display:flex;gap:12px;align-items:center}.hero .logo{margin-bottom:10px}
.rules{max-width:760px;margin:26px auto 0;padding:20px 26px;border:1.5px solid var(--line);border-radius:18px;background:rgba(3,40,22,.55);text-align:left;font-size:clamp(16px,2vw,21px);line-height:1.65}
.rules h3{margin-bottom:6px;font-size:24px}.rules li{margin-left:20px}
.img span{display:none}.img.miss span{display:block}.img.miss img{display:none}
.img.ra{margin:16px auto 0;max-width:620px;border-style:solid}.img.ra.miss{display:none}
#app.pl{display:flex;flex-direction:column;min-height:100vh}
.stage{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:3vh 0 20px}
.frame{position:relative;width:min(1100px,100%)}.frame.sm{width:min(960px,100%)}
.fq,.fb{position:relative;background:linear-gradient(rgba(8,72,42,.95),rgba(3,40,24,.95));border:2px solid rgba(200,245,215,.8);box-shadow:0 10px 30px #0008}
.fq{border-radius:4px 26px 4px 4px;padding:28px 30px 24px}
.fq h2{font-size:clamp(22px,3vw,36px);line-height:1.45;text-align:center;font-weight:800;margin:0}
.fb{margin-top:12px;border-radius:4px 4px 4px 26px;padding:22px}
.fb .imgs{margin-bottom:16px}.fb .imgs:last-child{margin-bottom:0}
.fb>.ans:first-child{margin-top:0;padding-top:0;border:0}
.pts{position:absolute;right:26px;top:-17px;z-index:3;background:linear-gradient(#ffe590,#e3a82c);color:#3a1a00;font-weight:900;padding:5px 18px;border-radius:12px;box-shadow:0 3px 0 #8a5a00,0 6px 14px #0006}
.tb{height:12px;margin-top:14px;border-radius:8px;background:#ffffff1f;border:1px solid #a8e6bc66;overflow:hidden}
.tb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#a8f0c0,#fff);transition:width .1s linear}.tb i.low{background:#ff4d5e;animation:pl .5s infinite alternate}
.pl .ctl{padding-bottom:24px;margin-top:8px}
.enter .frame{transform-origin:0 0;animation:grow .85s cubic-bezier(.2,.85,.25,1) both}
.enter .it,.enter .imgs{animation:fin .5s both;animation-delay:calc(.95s + var(--i,0)*.1s)}
.enter .tb{animation:fin .4s 1.2s both}.enter .fq h2,.enter .pts{animation:fin .5s 1.4s both}
.stage.pk{align-items:center}
.pkw{width:min(1000px,100%);text-align:center}
.pkg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:36px}
.pkc{position:relative;cursor:pointer;padding:56px 20px 42px;border:2px solid rgba(200,245,215,.8);border-radius:4px 28px 4px 28px;background:linear-gradient(rgba(8,72,42,.95),rgba(3,40,24,.95));box-shadow:0 10px 30px #0008;transition:transform .2s,box-shadow .2s}
.pkc:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 0 36px #6dffa4aa,0 10px 30px #0008}
.pkc b{display:block;font-size:min(15vw,160px);line-height:1;background:linear-gradient(#fff6cf,#f0bd45 55%,#a06c08);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;filter:drop-shadow(0 6px 16px #0007)}
.pkc em{font-style:normal;font-weight:900;letter-spacing:8px;font-size:clamp(18px,2.6vw,32px);color:#ffe08a}
.pkc .pts{font-size:26px;min-width:56px;text-align:center;top:-20px;right:22px}
.pkc.z{opacity:.35;pointer-events:none;filter:grayscale(.7)}
.enter .pkc{transform-origin:0 0;animation:grow .8s cubic-bezier(.2,.85,.25,1) backwards;animation-delay:calc(var(--i)*.18s)}
.btn[disabled]{opacity:.38;cursor:not-allowed;filter:grayscale(.5);box-shadow:none}.btn[disabled]:hover{filter:grayscale(.5)}.btn[disabled]:active{transform:none}
@keyframes grow{0%{transform:scale(.04);opacity:0}12%{opacity:1}100%{transform:none}}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes draw{from{width:0;opacity:1}to{width:100%;opacity:1}}
.stage.s{padding-top:12vh}.fb .imgs .img img{max-height:22vh}.img.ra img{max-height:24vh}
.opt{position:relative}
.gimg{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.gi{grid-column:span 2;position:relative;border-radius:16px;border:3px solid var(--line);background:#fff;overflow:hidden;transition:.3s}
.gi:nth-child(4){grid-column:2/span 2}.gi:nth-child(5){grid-column:4/span 2}
.gi .img,.gi .img:has(img){display:block;position:relative;border:0;border-radius:0;background:#fff;min-height:0;padding:0;height:clamp(120px,24vh,250px);color:#123;overflow:hidden}
.gi .img img{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:contain;border-radius:0}
.gi .img span{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:8px}.gi .img.miss span{display:grid}
.gi b{position:absolute;left:8px;top:8px;z-index:2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#d8283c;color:#fff;font-size:22px;border:2px solid #ffe08a}
.gi.ok{border-color:#2ecc71;box-shadow:0 0 0 4px #2ecc7199,0 0 34px #2ecc71}.gi.dim{opacity:.3;filter:grayscale(.7)}
.mg{display:grid;grid-template-columns:1fr 96px 1fr;gap:12px 0;align-items:stretch}
.lk{display:flex;align-items:center;padding:0 6px}

.lk i:after{content:"";position:absolute;right:-4px;top:-6px;width:16px;height:16px;border-radius:50%;background:#ffe08a;box-shadow:0 0 12px #f0bd45}
.mg.rv .lk i{animation:draw .6s .95s forwards}
.ord{gap:24px}
.ord.rv .opt:not(:last-child):after{content:"▼";position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);color:#ffe08a;font-size:15px}
.st{margin-left:auto;font-style:normal;font-weight:800;font-size:15px;background:#f0bd45;color:#3a1a00;border-radius:99px;padding:3px 14px;flex:none}

<script>
/* ============ NGÂN HÀNG CÂU HỎI (10 câu) — sửa/thêm theo đúng mẫu ============
 Chung: q = đề bài · p = điểm (10 hoặc 20: quyết định câu thuộc bộ nào, mặc định 10) · e = giải thích ngắn khi hiện đáp án
        im:[['images/cau-03','mô tả ảnh cần có']] = ảnh trong đề (đặt file images/cau-03.jpg; đuôi png/jpeg/webp cũng được)
        ra:'images/cau-08-dapan' = ảnh chỉ hiện cùng đáp án
 mcq   : o:[4 phương án], a:vị trí đúng (đếm từ 0)
 multi : o:[các phương án], a:[các vị trí đúng]
 pics  : oi:[đường dẫn ảnh các phương án A,B,C… (không ghi đuôi file)], a:[các vị trí đúng]
 tf    : o:[các ý a,b,c,d], a:[true,false,…]
 order : o:[các bước hiển thị theo A,B,C…], a:[thứ tự đúng, ví dụ [1,0,2,3] = B→A→C→D]
 match : l:[cột 1,2,3…], o:[cột A,B,C…], a:[với mỗi ý ở l, vị trí đúng ở o]
 short : a:'đáp án ngắn' */
const L='ABCDE',T={mcq:'TRẮC NGHIỆM',multi:'CHỌN NHIỀU ĐÁP ÁN',tf:'ĐÚNG – SAI',order:'SẮP XẾP',match:'GHÉP ĐÔI',short:'TRẢ LỜI NGẮN',pics:'CHỌN NHIỀU HÌNH ẢNH'};
const BANK=[
{t:'short',q:'Tế bào thực vật non có nhiều không bào nhỏ. Khi tế bào trưởng thành, các không bào này hợp lại thành cấu trúc nào?',a:'Không bào trung tâm'},
{t:'mcq',q:'Lysosome KHÔNG thực hiện chức năng nào sau đây?',o:['Phân giải các bào quan đã bị hư hỏng','Hỗ trợ tiêu hóa thức ăn theo con đường thực bào','Phân giải hydrogen peroxide (H₂O₂) sinh ra trong tế bào','Phân giải các tế bào cần được thay thế'],a:2,e:'Phân giải H₂O₂ là chức năng của peroxisome.'},
{t:'mcq',im:[['images/cau-03','Ảnh cánh hoa có màu sắc rõ nét (hoa tím hoặc đỏ)']],q:'Màu sắc của cánh hoa trong hình giúp thu hút côn trùng đến thụ phấn. Sắc tố tạo nên màu sắc đó được chứa trong bào quan nào?',o:['Lysosome','Không bào','Peroxisome','Ti thể'],a:1},
{t:'short',q:'Trong các loại tế bào: tế bào cơ, hồng cầu, bạch cầu, tế bào thần kinh, loại tế bào nào có nhiều lysosome nhất?',a:'Bạch cầu',e:'Bạch cầu thực bào nhiều nên cần tiêu hóa nội bào liên tục.'},
{t:'tf',p:20,q:'Về không bào, mỗi ý sau đúng hay sai?',o:['Không bào chỉ có ở tế bào thực vật.','Quả chanh có vị chua vì dịch không bào chứa citric acid.','Không bào thường bắt nguồn từ lưới nội chất và bộ máy Golgi.','Không bào co bóp ở trùng giày thực hiện chức năng tiêu hóa thức ăn.'],a:[false,true,true,false],e:'Không bào tiêu hóa thực hiện tiêu hóa thức ăn; không bào co bóp đưa nước thừa ra khỏi tế bào.'},
{t:'order',p:20,q:'Sắp xếp các giai đoạn sau theo đúng thứ tự, từ khi tạo ra enzyme thủy phân đến khi lysosome phân giải xong:',o:['Golgi đóng gói enzyme thành lysosome','Ribosome tổng hợp enzyme thủy phân','Enzyme phân giải bào quan bị hư hỏng','Giữ lại chất tái sử dụng, đưa chất thải ra ngoài'],a:[1,0,2,3]},
{t:'match',p:20,q:'Ghép mỗi tình huống với bào quan tương ứng:',l:['Tế bào tiêu hóa vi khuẩn mà nó vừa thực bào','Tế bào gan phân giải H₂O₂ sinh ra trong tế bào','Trùng giày sống trong nước ngọt đưa nước thừa ra khỏi tế bào','Cánh hoa chứa sắc tố thu hút côn trùng'],o:['Không bào co bóp','Lysosome','Không bào chứa sắc tố','Peroxisome'],a:[1,3,0,2]},
{t:'short',q:'Ở tế bào não, một số enzyme phân giải chất béo bị mất chức năng, làm lipid tích tụ, gây tổn thương não và có thể dẫn đến tử vong. Bào quan nào bị rối loạn chức năng?',a:'Peroxisome',ra:'images/cau-08-dapan'},
{t:'short',q:'Ở thực vật, loại peroxisome đặc biệt chứa enzyme phân tách acid béo thành acetyl-CoA có tên là gì?',a:'Glioxysome',e:'Acetyl-CoA được đưa đến ti thể để tham gia hô hấp tế bào.'},
{t:'pics',p:20,q:'Những hình nào dưới đây thể hiện bào quan được bao bọc bởi màng đơn?',oi:['images/cau-10-a','images/cau-10-b','images/cau-10-c','images/cau-10-d','images/cau-10-e'],a:[1,2,4],e:'Lysosome (B), không bào (C) và peroxisome (E) có màng đơn. Ti thể (A) và lục lạp (D) có màng kép.'}
];
const $=s=>document.querySelector(s),app=$('#app'),LOGO='images/logo-thpt-soc-son.png';
let S={},ac;
const Q=()=>BANK.map((q,i)=>({id:i,p:10,...q}));
/* Âm thanh: nếu có file trong thư mục audio/ thì dùng file, không có thì dùng âm thanh tự tạo (riêng nhạc nền: không có file thì không phát) */
const AU={};['nhac-nen','chuyen-cau','dap-an','het-gio'].forEach(n=>{const a=new Audio('audio/'+n+'.mp3');a.preload='auto';a.oncanplaythrough=()=>a.ok=1;AU[n]=a});AU['nhac-nen'].loop=true;
function tn(f,t,d,ty='sine',v=.05){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function ctx(){ac=ac||new AudioContext();return ac.currentTime}
function beep(f,d,ty){try{tn(f,ctx(),d,ty,.07)}catch(e){}}
const fbQ=()=>{try{const t=ctx();tn(90,t,.4,'sine',.2);[784,988,1175,1568].forEach((f,i)=>tn(f,t+.15+i*.09,.35,'triangle',.07))}catch(e){}},fbA=()=>beep(880,.2),fbT=()=>beep(160,.6,'square');
function snd(n,fb){const a=AU[n];if(a.ok){a.currentTime=0;a.play().catch(()=>{})}else if(fb)fb()}
function music(on){const a=AU['nhac-nen'];if(!a.ok)return;on?a.play().catch(()=>{}):a.pause()}
function pic(p){return`<img src="${p}.jpg" onerror="nx(this,'${p}')">`}
function nx(e,p){const x=['png','jpeg','webp'],i=+(e.dataset.i||0);e.dataset.i=i+1;if(i<3)e.src=p+'.'+x[i];else e.parentNode.classList.add('miss')}
function home(){stopT();S.scr='home';app.className='';app.innerHTML=`<div class="hero"><img class="logo" src="${LOGO}" alt="THPT Sóc Sơn"><h1 class="gold">MINIGAME</h1><p class="sub">Sinh học 10 · Lysosome – Không bào – Peroxisome</p></div>
<div class="rules"><h3 class="gold">THỂ LỆ</h3><ul><li>Học sinh giơ tay trước được gọi lên chọn bộ câu hỏi 10 điểm hoặc 20 điểm. Mỗi câu có 20 giây.</li><li>Trả lời sai: không bị trừ điểm, không bị phạt.</li><li>Trả lời đúng: nhận phần quà tương ứng với số điểm của câu hỏi (10 điểm hoặc 20 điểm).</li></ul></div>
<div class="row" style="margin:30px 0"><button class="btn big" onclick="newGame()">▶ BẮT ĐẦU</button></div>`}
function newGame(){S={all:Q(),pool:{}};S.all.forEach(q=>(S.pool[q.p]=S.pool[q.p]||[]).push(q.id));pick()}
function pick(){stopT();S.scr='pick';const ks=Object.keys(S.pool);if(!ks.some(k=>S.pool[k].length))return end();app.className='pl enter';
app.innerHTML=`<div class="top"><div class="lf"><img class="logo sm" src="${LOGO}" alt=""><button class="btn ghost sm" onclick="home()">← Trang đầu</button></div><div class="tag">MỜI BẠN CHỌN MỨC ĐIỂM</div><div><button class="btn ghost sm" onclick="fs()">⛶</button></div></div>
<div class="stage pk"><div class="pkw"><div class="pkg">${ks.map((k,i)=>`<div class="pkc${S.pool[k].length?'':' z'}" style="--i:${i}" onclick="draw(${k})"><span class="pts">${S.pool[k].length}</span><b>${k}</b><em>ĐIỂM</em></div>`).join('')}</div></div></div>`}
function draw(k){const a=S.pool[k];if(!a||!a.length)return;const id=a[Math.random()*a.length|0];S.pool[k]=a.filter(x=>x!=id);S.cur=S.all.find(q=>q.id==id);S.scr='play';load()}
function load(){stopT();try{AU['nhac-nen'].currentTime=0}catch(e){}S.rev=false;S.started=false;S.max=S.t=20;S.enter=true;play();snd('chuyen-cau',fbQ)}
function play(){const q=S.cur,fb=imgs(q)+body(q)+(S.rev?ans(q):''),sh=q.t=='short';app.className='pl'+(S.enter?' enter':'');S.enter=false;
app.innerHTML=`<div class="top"><div class="lf"><img class="logo sm" src="${LOGO}" alt=""></div><div class="tag">${T[q.t]}</div><div><button class="btn ghost sm" onclick="fs()">⛶</button></div></div>
<div class="stage${sh?' s':''}"><div class="frame${sh?' sm':''}"><div class="fq"><span class="pts">${q.p} điểm</span><h2>${q.q}</h2></div>${fb?`<div class="fb">${fb}</div>`:''}<div class="tb"><i id="tb"></i></div></div></div>
<div class="ctl"><button class="btn" id="tg" onclick="tog()"></button><button class="btn ghost" id="rv" onclick="rev()">👁 Đáp án</button><button class="btn ghost" id="nx" onclick="back()"></button></div>`;upd()}
function back(){if(S.started&&!S.rev)return;if(!S.rev&&S.cur)S.pool[S.cur.p].push(S.cur.id);pick()}
function rev(){if(S.rev||!S.started||S.run)return;const q=S.cur,old={};document.querySelectorAll('[data-k]').forEach(e=>old[e.dataset.k]=e.getBoundingClientRect());S.rev=true;stopT();snd('dap-an',fbA);play();
document.querySelectorAll('[data-k]').forEach(e=>{const o=old[e.dataset.k];if(!o)return;const r=e.getBoundingClientRect(),dx=o.left-r.left,dy=o.top-r.top;if(!dx&&!dy)return;e.style.transition='none';e.style.transform=`translate(${dx}px,${dy}px)`;e.offsetWidth;e.style.transition='transform .9s cubic-bezier(.3,1,.4,1)';e.style.transform='none'})}
function end(){stopT();S.scr='end';app.className='';app.innerHTML=`<div class="hero" style="padding-top:60px"><img class="logo" src="${LOGO}" alt=""><h1 class="gold">KẾT THÚC</h1><p class="sub">Cảm ơn các bạn đã tham gia!</p></div><div class="row" style="margin-top:30px"><button class="btn" onclick="newGame()">↻ Chơi lại</button><button class="btn ghost" onclick="home()">← Trang đầu</button></div>`;[659,784,988,1318].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*160))}
function imgs(q){return q.im?`<div class="imgs">${q.im.map(([p,n])=>`<div class="img">${pic(p)}<span>🖼️ Ảnh tạm thời<small>${n}<br>Thêm file: ${p}.jpg</small></span></div>`).join('')}</div>`:''}
function body(q){const rv=S.rev,A=[].concat(q.a),n=(q.o||[]).map((_,i)=>i);
if(q.t=='mcq'||q.t=='multi')return`<div class="opts">${q.o.map((x,i)=>`<div class="opt it ${rv?(A.includes(i)?'ok':'dim'):''}" style="--i:${i}"><b>${L[i]}</b>${x}</div>`).join('')}</div>`;
if(q.t=='pics')return`<div class="gimg">${q.oi.map((p,i)=>`<div class="gi it ${rv?(A.includes(i)?'ok':'dim'):''}" style="--i:${i}"><b>${L[i]}</b><div class="img">${pic(p)}<span>🖼️ ${p}</span></div></div>`).join('')}</div>`;
if(q.t=='tf')return`<div class="tfs">${q.o.map((x,i)=>`<div class="tfr it ${rv?(q.a[i]?'ok':'no'):''}" style="--i:${i}"><b>${'abcd'[i]}</b><span>${x}</span><i>${rv?(q.a[i]?'ĐÚNG':'SAI'):'?'}</i></div>`).join('')}</div>`;
if(q.t=='order'){const od=rv?q.a:n;return`<div class="opts one ord${rv?' rv':''}">${od.map((j,r)=>`<div class="opt it" data-k="o${j}" style="--i:${r}"><b>${L[j]}</b>${q.o[j]}${rv?`<em class="st">Bước ${r+1}</em>`:''}</div>`).join('')}</div>`}
if(q.t=='match'){const od=rv?q.a:n;return`<div class="mg${rv?' rv':''}">${q.l.map((x,r)=>`<div class="opt it" style="--i:${r}"><b>${r+1}</b>${x}</div><div class="lk"><i></i></div><div class="opt it" data-k="m${od[r]}" style="--i:${r}"><b>${L[od[r]]}</b>${q.o[od[r]]}</div>`).join('')}</div>`}
return''}
function ans(q){let h='';if(q.t=='short')h+=`<div class="ansbox gold">${q.a}</div>`;if(q.e)h+=`<p class="ex">Giải thích: ${q.e}</p>`;if(q.ra)h+=`<div class="img ra">${pic(q.ra)}<span></span></div>`;return h?`<div class="ans">${h}</div>`:''}
function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
function tog(){if(S.rev)return;S.run?stopT():startT()}
function startT(){clearInterval(S.iv);if(S.t<=0){S.t=S.max;try{AU['nhac-nen'].currentTime=0}catch(e){}}S.run=true;S.started=true;music(1);S.iv=setInterval(()=>{S.t=Math.max(0,S.t-.1);if(S.t<=0){stopT();snd('het-gio',fbT)}else if(S.t<=5&&Math.abs(S.t-Math.round(S.t))<.05)beep(720,.05);upd()},100);upd()}
function stopT(){clearInterval(S.iv);S.run=false;music(0);upd()}
function upd(){const b=$('#tb'),g=$('#tg');if(!b||S.scr!='play')return;b.style.width=S.t/S.max*100+'%';b.classList.toggle('low',S.t<=5&&S.t>0);g.textContent=S.run?'⏸ Tạm dừng':(S.t<S.max&&S.t>0?'▶ Tiếp tục':'▶ Bắt đầu');const r=$('#rv'),n=$('#nx');if(r)r.disabled=S.rev||!S.started||S.run;if(n){n.disabled=!!S.started&&!S.rev;n.textContent=S.rev?'Chọn câu tiếp ›':'← Chọn lại'}}
addEventListener('keydown',e=>{if(S.scr!='play')return;if(['Enter',' ','Escape'].includes(e.key)){e.preventDefault();document.activeElement&&document.activeElement.blur()}if(e.key=='Enter')S.rev?pick():rev();else if(e.key=='Escape')back();else if(e.key==' ')tog();else if(e.key=='f'||e.key=='F')fs()});
addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b)b.blur()});
home();

</script></body></html>
